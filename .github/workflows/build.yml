name: build

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*.*.*'
    paths:
      - '**/*.*'
      - '!**/*.md'
  pull_request:
    branches:
      - master
      - main
    paths:
      - '**/*.*'
      - '!**/*.md'

concurrency:
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          # test projects target net8.0, so the 8.0 runtime is needed as well
          dotnet-version: '8.0.x'
          global-json-file: global.json

      - name: Determine version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            prefix="${GITHUB_REF_NAME#v}"
            suffix=""
          else
            prefix=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
            suffix="preview-$(date -u +%Y%m%d-%H%M)"
          fi
          if [[ "$prefix" == *-* ]]; then
            suffix="${prefix#*-}"
            prefix="${prefix%%-*}"
          fi
          version="$prefix${suffix:+-$suffix}"
          echo "Version prefix: $prefix, package version: $version"
          echo "VERSION_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install npm packages
        working-directory: src/NSwag.CodeGeneration.TypeScript.Tests
        run: npm ci

      - name: Restore
        run: dotnet restore src/NSwag.sln --verbosity minimal

      - name: Build
        run: >
          dotnet build src/NSwag.sln
          --no-restore
          --configuration $CONFIGURATION
          --verbosity minimal
          -p:AssemblyVersion=$VERSION_PREFIX
          -p:FileVersion=$VERSION_PREFIX
          -p:InformationalVersion=$VERSION_PREFIX
          -p:Deterministic=true
          -p:ContinuousIntegrationBuild=true
          -p:WarningLevel=0

      - name: Test
        run: dotnet test src/NSwag.sln --no-build --configuration $CONFIGURATION --logger GitHubActions

      - name: Pack
        run: |
          for project in NSwag.Core NSwag.CodeGeneration NSwag.CodeGeneration.CSharp NSwag.CodeGeneration.TypeScript; do
            dotnet pack "src/$project/$project.csproj" \
              --no-restore \
              --no-build \
              --configuration $CONFIGURATION \
              --output artifacts \
              -p:AssemblyVersion=$VERSION_PREFIX \
              -p:FileVersion=$VERSION_PREFIX \
              -p:InformationalVersion=$VERSION_PREFIX \
              -p:Version=$PACKAGE_VERSION
          done

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v5
        with:
          name: NuGet Packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  publish:
    needs: build
    if: github.event_name == 'push' && github.repository_owner == 'RicoSuter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0'

      - uses: actions/download-artifact@v5
        with:
          name: NuGet Packages
          path: artifacts

      - name: Push to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ secrets.NUGET_API_KEY }}" --skip-duplicate

      # preview packages from master are best-effort
      - name: Push to MyGet
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        run: dotnet nuget push "artifacts/*.nupkg" --source https://www.myget.org/F/nswag/api/v2/package --api-key "${{ secrets.MYGET_API_KEY }}" --skip-duplicate
